name: Build CameraGuard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025-vs2026
            qt_arch: win64_msvc2022_64
            artifact: CameraGuard-Windows-x64
          - name: macOS Apple Silicon
            runner: macos-15
            qt_arch: clang_64
            mac_arch: arm64
            artifact: CameraGuard-macOS-arm64
          - name: macOS Intel
            runner: macos-15-intel
            qt_arch: clang_64
            mac_arch: x86_64
            artifact: CameraGuard-macOS-x86_64

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: ${{ matrix.qt_arch }}
          modules: qtmultimedia
          cache: true

      - name: Build and test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build -G 'Visual Studio 18 2026' -A x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Package and check Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package, dist | Out-Null
          Copy-Item build/Release/CameraGuard.exe, README.md package/
          windeployqt --release --no-translations package/CameraGuard.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:PATH = (($env:PATH -split ';') | Where-Object { $_ -notlike "$env:QT_ROOT_DIR*" }) -join ';'
          $process = Start-Process -FilePath (Resolve-Path package/CameraGuard.exe) -ArgumentList '--smoke-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Packaged app failed its MP4 encoder check" }
          Compress-Archive -Path package/* -DestinationPath dist/${{ matrix.artifact }}.zip

      - name: Build and test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content CMakeLists.txt -Raw), 'project\(CameraGuard VERSION ([0-9.]+)').Groups[1].Value
          if (!$version) { throw 'CameraGuard version not found' }
          $compiler = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          $iscc = if ($compiler) { $compiler.Source } else { "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (!(Test-Path $iscc)) { throw 'Inno Setup compiler is missing' }
          & $iscc "/DAppVersion=$version" packaging/CameraGuard.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

          Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          $env:PATH = (($env:PATH -split ';') | Where-Object { $_ -notlike "$env:QT_ROOT_DIR*" }) -join ';'
          $target = Join-Path $env:RUNNER_TEMP 'CameraGuard Installer Test'
          $setup = Resolve-Path dist/CameraGuard-Windows-x64-Setup.exe
          $setupArgs = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /NOICONS'
          $versionInfo = (Get-Item -LiteralPath $setup.Path).VersionInfo
          $fileVersion = "$($versionInfo.FileMajorPart).$($versionInfo.FileMinorPart).$($versionInfo.FileBuildPart)"
          if ($fileVersion -ne $version) { throw "Incorrect setup version: $fileVersion" }

          $oldSetup = Join-Path $env:RUNNER_TEMP 'CameraGuard-0.3.0-Setup.exe'
          Invoke-WebRequest -Uri 'https://github.com/Hotakacchi/CameraGuard/releases/download/v0.3.0/CameraGuard-Windows-x64-Setup.exe' -OutFile $oldSetup
          $oldHash = (Get-FileHash -LiteralPath $oldSetup -Algorithm SHA256).Hash
          if ($oldHash -ne '842e8439bf87fd6eddcc019ce30bb981990287cfe901e82db60ab631cc562938') { throw 'Previous installer checksum mismatch' }
          $oldArgs = "$setupArgs /DIR=`"$target`""
          $oldInstall = Start-Process -FilePath $oldSetup -ArgumentList $oldArgs -Wait -PassThru
          if ($oldInstall.ExitCode -ne 0) { throw "Previous installer failed: $($oldInstall.ExitCode)" }

          $recordings = Join-Path $env:LOCALAPPDATA 'Hotakacchi/CameraGuard/recordings'
          New-Item -ItemType Directory -Path $recordings -Force | Out-Null
          $clip = Join-Path $recordings 'guard_20260101_010101_123456789abc.mp4'
          Set-Content -LiteralPath $clip -Value 'Recording fixture'
          $clipHash = (Get-FileHash -LiteralPath $clip).Hash
          $settings = 'HKCU:\Software\Hotakacchi\CameraGuard'
          New-Item -Path $settings -Force | Out-Null
          New-ItemProperty -Path $settings -Name 'days' -Value 30 -PropertyType DWord -Force | Out-Null

          $app = Join-Path $target 'CameraGuard.exe'
          $oldAppHash = (Get-FileHash -LiteralPath $app).Hash
          $locked = [IO.File]::Open($app, 'Open', 'Read', 'None')
          try {
            $blocked = Start-Process -FilePath $setup -ArgumentList $setupArgs -Wait -PassThru
            if ($blocked.ExitCode -ne 7) { throw "Expected a blocked update, got exit code $($blocked.ExitCode)" }
          } finally {
            $locked.Dispose()
          }
          if ((Get-FileHash -LiteralPath $app).Hash -ne $oldAppHash) { throw 'Blocked update changed the installed app' }

          $install = Start-Process -FilePath $setup -ArgumentList $setupArgs -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Update failed: $($install.ExitCode)" }
          if ((Get-FileHash -LiteralPath $app).Hash -ne (Get-FileHash package/CameraGuard.exe).Hash) {
            throw 'Update did not install the new executable in the previous directory'
          }
          if ((Get-FileHash -LiteralPath $clip).Hash -ne $clipHash -or (Get-ItemPropertyValue -Path $settings -Name 'days') -ne 30) {
            throw 'Update changed the existing recording or settings'
          }
          $process = Start-Process -FilePath $app -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installed app failed its MP4 encoder check" }
          $uninstaller = Get-ChildItem -LiteralPath $target -Filter 'unins*.exe' | Select-Object -First 1
          if (!$uninstaller) { throw 'Uninstaller is missing' }
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0 -or (Test-Path $app)) { throw 'Uninstall test failed' }

      - name: Build and test on macOS
        if: runner.os == 'macOS'
        env:
          TARGET_ARCH: ${{ matrix.mac_arch }}
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="$TARGET_ARCH" -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Package and check macOS app
        if: runner.os == 'macOS'
        env:
          TARGET_ARCH: ${{ matrix.mac_arch }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          mkdir -p package dist
          ditto build/CameraGuard.app package/CameraGuard.app
          cp README.md package/
          macdeployqt package/CameraGuard.app -always-overwrite -codesign=-
          codesign --verify --deep --strict package/CameraGuard.app
          lipo package/CameraGuard.app/Contents/MacOS/CameraGuard -verify_arch "$TARGET_ARCH"
          plutil -extract NSCameraUsageDescription raw package/CameraGuard.app/Contents/Info.plist
          env -u QT_PLUGIN_PATH -u DYLD_LIBRARY_PATH package/CameraGuard.app/Contents/MacOS/CameraGuard --smoke-test
          ditto -c -k package "dist/$ARTIFACT.zip"

      - name: Build and test macOS disk image
        if: runner.os == 'macOS'
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          ln -s /Applications package/Applications
          image="dist/$ARTIFACT.dmg"
          hdiutil create -srcfolder package -volname CameraGuard -format UDZO -o "$image"
          hdiutil verify "$image"
          mount="$(mktemp -d)"
          hdiutil attach "$image" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          test "$(readlink "$mount/Applications")" = /Applications
          codesign --verify --deep --strict "$mount/CameraGuard.app"
          env -u QT_PLUGIN_PATH -u DYLD_LIBRARY_PATH "$mount/CameraGuard.app/Contents/MacOS/CameraGuard" --smoke-test

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-installer
          path: |
            dist/*-Setup.exe
            dist/*.dmg
          compression-level: 0
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.zip
          if-no-files-found: error
